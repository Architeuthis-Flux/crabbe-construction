# "Ask Claude" server for the site: a Cloudflare Worker between the chat page (ask.html) and the
# Claude API. Deploy from this folder:   cd chat && npm install && npx wrangler deploy
# The Anthropic API key is not here. It is set once, from this folder, with
#   wrangler secret put ANTHROPIC_API_KEY
name = "crabbe-construction-chat"
main = "src/index.js"
compatibility_date = "2026-11-11"

[vars]
# Which Claude model answers, and how hard it thinks (low, medium, high, xhigh, max).
# Fable is the most capable and the most expensive; claude-opus-5-5 or claude-sonnet-5-5 cost less.
MODEL = "claude-fable-5-2"
EFFORT = "high"
# Only people who can write to this repo may use the chat.
REPO = "Architeuthis-Flux/crabbe-construction"
# Only pages on these origins may call the server. Add the real domain when the site moves there.
ALLOWED_ORIGINS = "https://architeuthis-flux.github.io"
