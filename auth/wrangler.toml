# Sign-in server for the site editor: Sveltia CMS Authenticator on Cloudflare Workers.
# It lets "Sign In with GitHub" work on the editor's login screen. Deploy with auth/deploy.sh.
# The GitHub App's client secret is not here: it is set once with
#   wrangler secret put GITHUB_CLIENT_SECRET --name crabbe-construction-auth
name = "crabbe-construction-auth"
main = "src/index.js"
compatibility_date = "2026-11-11"

[vars]
# Only pages on these hostnames may use the sign-in server. Never leave this empty: the
# authenticator allows every site when it is. Add the real domain once the site is served there.
ALLOWED_DOMAINS = "architeuthis-flux.github.io"
# Client ID of the GitHub App (public, it appears in the sign-in address).
GITHUB_CLIENT_ID = ""
