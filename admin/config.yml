# Editor setup for Crabbe Construction & Design (Sveltia CMS, https://sveltiacms.app).
# Each collection below is a form. Saving commits a JSON file to the repo; the site rebuilds in about a minute.
# If the repo is renamed or transferred to another account, change `repo` below.

backend:
  name: github
  repo: Architeuthis-Flux/crabbe-construction
  branch: main
  # Sign-in server (shared, deployed from the friend-sites kit): makes the "Sign In with GitHub" button work.
  base_url: https://crabbe-construction-auth.kevinc-af9.workers.dev

site_url: https://architeuthis-flux.github.io/crabbe-construction/

# Every uploaded photo lands in one folder, shrunk to web size on the way in (phone photos are 5-10 MB).
media_folder: photos
public_folder: /photos
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1800
          height: 1800

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: One entry per job. Each gets its own page and a card on the Works page.
    folder: content/projects
    format: json
    extension: json
    create: true
    editor:
      preview: false
    fields:
      - { name: title, label: Project name, widget: string, hint: 'For example "Deer Flats Exterior". The page address comes from this name.' }
      - { name: kind, label: Type, widget: select, options: [Residential, Commercial], default: Residential }
      - { name: location, label: Town, widget: string, required: false, hint: 'For example "Carmel Valley, CA". Helps people searching for a builder in that town find this project.' }
      - { name: summary, label: One-line description, widget: string, required: false, hint: "Shown on the card and under the title." }
      - { name: cover, label: Main photo, widget: image, hint: "The photo on the card and at the top of the project page." }
      - { name: photos, label: More photos, widget: image, multiple: true, required: false, hint: "Pick as many as you like. They show as a gallery in this order." }
      - name: body
        label: The story
        widget: richtext
        format: html
        required: false
        modes: [rich_text]
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: [image]
        hint: Optional. What the job was, what you built, anything worth telling.
      - { name: featured, label: Show on the home page, widget: boolean, default: true }
      - { name: order, label: Position, widget: number, value_type: int, default: 0, required: false, hint: "Lower numbers show first. Leave at 0 to put a new project at the top." }

  - name: pages
    label: Pages
    label_singular: Page
    description: Extra pages, for example "Our Process" or "Careers". Each one can appear in the menu.
    folder: content/pages
    format: json
    extension: json
    create: true
    editor:
      preview: false
    fields:
      - { name: title, label: Page title, widget: string, hint: "The page address and the menu link come from this." }
      - { name: menu, label: Show in the menu, widget: boolean, default: true }
      - { name: intro, label: Opening line, widget: string, required: false, hint: "Optional. One sentence under the title." }
      - name: body
        label: Page text
        widget: richtext
        format: html
        required: false
        modes: [rich_text]
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
        editor_components: [image]
      - { name: photos, label: Photos, widget: image, multiple: true, required: false, hint: "Optional. Shown as a gallery under the text." }

  - name: site
    label: Home page
    description: The words and photos on the home page, plus the phone number shown everywhere.
    editor:
      preview: false
    files:
      - name: site
        label: Home page and contact details
        file: content/site.json
        fields:
          - { name: name, label: Company name, widget: string }
          - { name: area, label: Where you work, widget: string, hint: "Shown in the footer." }
          - { name: city, label: Home town, widget: string, required: false, hint: "Where the business is based. Told to search engines; not shown on the page." }
          - { name: state, label: State, widget: string, required: false, default: CA }
          - { name: license, label: Contractor license number, widget: string, required: false, hint: "Shown in the footer." }
          - { name: url, label: Website address, widget: string, required: false, hint: 'Leave empty until the site is live on its own domain, then fill in for example "https://constructioncrabbe.com". While empty, search engines are asked not to list the site.' }
          - { name: seo_title, label: Title in search results, widget: string, required: false, hint: "The blue link people see on Google. About 60 characters." }
          - { name: seo_description, label: Description in search results, widget: text, required: false, hint: "The two lines under the link on Google. About 155 characters." }
          - { name: phone, label: Phone number, widget: string }
          - { name: email, label: Email address, widget: string, required: false, hint: "Optional. If filled in, it shows in the Contact section." }
          - { name: form_key, label: Contact form key, widget: string, required: false, hint: "The access key from web3forms.com for the inbox that should get messages. The contact form appears once this is filled in. Leave empty for no form." }
          - { name: hero_photo, label: Big photo at the top, widget: image }
          - { name: hero_photos, label: More photos for the top slideshow, widget: image, multiple: true, required: false, hint: "Optional. The top of the home page fades between the big photo and these, in this order. Wide photos work best." }
          - { name: services_photo, label: "Photo behind the middle of the home page", widget: image, required: false, hint: "Optional. One photo that stays still behind Design and build, Services, About and Recent Works while the page scrolls over it." }
          - { name: hero_alt, label: What the big photo shows, widget: string, required: false, hint: "One plain sentence, for search engines and screen readers." }
          - { name: headline, label: Lines under the company name, widget: text, hint: "Each line you type here is its own line on the page." }
          - { name: intro, label: Introduction, widget: text }
          - { name: approach_title, label: Design and build heading, widget: string, required: false }
          - { name: approach, label: Design and build text, widget: text, required: false, hint: "Leave a blank line to start a new paragraph. Leave empty to hide the section." }
          - name: services
            label: Services
            label_singular: Service
            widget: list
            fields:
              - { name: title, label: Name, widget: string }
              - { name: icon, label: Drawing, widget: select, required: false, options: [{ label: House, value: build }, { label: Floor plan, value: remodel }, { label: Cabinet, value: cabinets }, { label: Pencil and ruler, value: design }], hint: "The small line drawing above the name." }
              - { name: text, label: Description, widget: text, hint: "Leave a blank line to start a new paragraph." }
          - { name: philosophy, label: Philosophy quote, widget: text }
          - { name: owner, label: Owner name, widget: string, hint: "Signs the quote and the Contact section." }
          - { name: portrait, label: Photo of the owner, widget: image, required: false }
          - { name: about_title, label: About heading, widget: string }
          - { name: about, label: About text, widget: text, hint: "Leave a blank line to start a new paragraph." }
          - { name: clients_label, label: Client section small heading, widget: string, required: false }
          - { name: clients_title, label: Client section heading, widget: string, required: false, hint: "Leave empty to hide the whole section." }
          - { name: clients_text, label: Client section text, widget: text, required: false }
          - name: clients_points
            label: Client section boxes
            label_singular: Box
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Name, widget: string }
              - { name: text, label: One line, widget: string }
          - { name: portal_url, label: Client login address, widget: string, required: false, hint: 'The web address of the client portal, starting with https://. While empty the section says "Client login coming soon".' }
          - { name: contact_lead, label: Line above "Contact us", widget: string }
          - { name: map_place, label: Map behind "Contact us", widget: string, required: false, hint: 'A place name Google Maps knows, for example "Monterey, CA". A town works best: it shows one pin. Leave empty for no map.' }
          - { name: map_zoom, label: Map zoom, widget: number, value_type: int, min: 3, max: 18, default: 11, required: false, hint: "Higher is closer. 11 shows the whole peninsula, 13 one town." }
          - { name: towns, label: Towns you work in, label_singular: Town, widget: list, required: false, hint: "Shown in the box under Services on the home page and told to search engines." }
